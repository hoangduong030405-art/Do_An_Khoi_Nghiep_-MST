        },
        {
          id: 'esri_streets',
          name: 'Esri World Street Map',
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
          subdomains: '',
          maxZoom: 19,
          attribution: 'Tiles &copy; <a href="https://www.esri.com/" target="_blank">Esri</a> ArcGIS'
        },
        {
          id: 'osm_standard',
          name: 'OpenStreetMap Standard',
          url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
          subdomains: 'abc',
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
        }
      ],
      // Vệ tinh Esri: KHÔNG nằm trong chuỗi dự phòng, chỉ là lớp người dùng tự chọn bằng nút
      satelliteProvider: {
        id: 'esri_satellite',
        name: 'Vệ tinh (Esri World Imagery)',
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        subdomains: '',
        maxZoom: 19,
        attribution: 'Tiles &copy; <a href="https://www.esri.com/" target="_blank">Esri</a>, Maxar, Earthstar Geographics'
      }
    };

    let map;
    let markersClusterGroup;
    let currentTileLayer = null;
    let satelliteTileLayer = null;
    let isSatelliteMode = false;
    let currentStreetIndex = 0;
    let triedStreetProviders = new Set([0]); // Chuyển nguồn chỉ một lần mỗi nguồn (tránh vòng lặp)
    let fallbackScheduled = false;

    function createTileLayer(providerConfig) {
      const options = {
        maxZoom: providerConfig.maxZoom || 19,
        attribution: providerConfig.attribution
      };
      if (providerConfig.subdomains) {
        options.subdomains = providerConfig.subdomains;
      }
      return L.tileLayer(providerConfig.url, options);
    }

    function attachTileErrorFallback(layer, providerIndex) {
      layer.on('tileerror', function() {
        if (isSatelliteMode || fallbackScheduled) return;

        let nextIndex = -1;
        for (let i = 0; i < HUEGO_MAP_CONFIG.streetProviders.length; i++) {
          if (!triedStreetProviders.has(i)) {
            nextIndex = i;
            break;
          }
        }

        if (nextIndex !== -1) {
          fallbackScheduled = true;
          triedStreetProviders.add(nextIndex);
          const failedName = HUEGO_MAP_CONFIG.streetProviders[providerIndex].name;
          const nextProvider = HUEGO_MAP_CONFIG.streetProviders[nextIndex];
          console.warn(`[HUEGO Map] Nguồn "${failedName}" lỗi tải tile. Tự động chuyển dự phòng sang "${nextProvider.name}".`);

          setTimeout(function() {
            if (!isSatelliteMode && map) {
              if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
              }
              currentStreetIndex = nextIndex;
              currentTileLayer = createTileLayer(nextProvider);
              attachTileErrorFallback(currentTileLayer, nextIndex);
              currentTileLayer.addTo(map);
              currentTileLayer.bringToBack();
            }
            fallbackScheduled = false;
          }, 250);
        } else {
          console.warn('[HUEGO Map] Đã thử qua tất cả các nguồn bản đồ đường phố dự phòng.');
        }
      });
    }

    window.toggleMapType = function() {
      if (!map) return;
      isSatelliteMode = !isSatelliteMode;
      const iconEl = document.getElementById('mapLayerIcon');
      const textEl = document.getElementById('mapLayerText');

      if (isSatelliteMode) {
        if (currentTileLayer) map.removeLayer(currentTileLayer);
        if (!satelliteTileLayer) {
          satelliteTileLayer = createTileLayer(HUEGO_MAP_CONFIG.satelliteProvider);
        }
        satelliteTileLayer.addTo(map);
        satelliteTileLayer.bringToBack();
        if (iconEl) iconEl.textContent = '🗺️';
        if (textEl) textEl.textContent = 'Đường phố';
      } else {
        if (satelliteTileLayer) map.removeLayer(satelliteTileLayer);
        if (!currentTileLayer) {
          currentTileLayer = createTileLayer(HUEGO_MAP_CONFIG.streetProviders[currentStreetIndex]);
          attachTileErrorFallback(currentTileLayer, currentStreetIndex);
        }
        currentTileLayer.addTo(map);
        currentTileLayer.bringToBack();
        if (iconEl) iconEl.textContent = '🛰️';
        if (textEl) textEl.textContent = 'Vệ tinh';
      }
    };

    function handleThumbnailError(imgElement, category, name) {
      if (!imgElement) return;
      imgElement.onerror = null;
      imgElement.alt = '';
      if (typeof window.generateDynamicSvgPlaceholder === 'function') {
        imgElement.src = window.generateDynamicSvgPlaceholder(category, name);
      } else {
        const safeName = (name || 'Huế Heritage').replace(/[<>&"']/g, '');
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">' +
          '<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">' +
          '<stop offset="0%" stop-color="#1E1B4B"/><stop offset="100%" stop-color="#312E81"/>' +
          '</linearGradient></defs>' +
          '<rect width="400" height="220" fill="url(#g)"/>' +
          '<circle cx="200" cy="85" r="36" fill="#4338CA" opacity="0.6"/>' +
          '<text x="200" y="96" font-family="sans-serif" font-size="28" text-anchor="middle" fill="#FFFFFF">🏛️</text>' +
          '<text x="200" y="145" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#E0E7FF">' + safeName + '</text>' +
          '<text x="200" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#A5B4FC">HUEGO CỐ ĐÔ HUẾ</text>' +
          '</svg>';
        imgElement.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }
    }
    let allHeritageZones = [];
    let currentFilterCat = 'All';
    let activeVerticals = new Set(['tour', 'fnb', 'cafe', 'stay', 'specialty', 'nature', 'service']);
    let allMapPoints = [];
    let selectedPlaceData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      initMap();
      await loadHeritageSites();
      await loadAllMapPoints();
      initFilterPills();
    });

    function initMap() {
      // Tọa độ trung tâm Huế: 16.467, 107.590
      map = L.map('main-hue-map', {
        zoomControl: true
      }).setView([16.467, 107.590], 13);

      // Khởi tạo lớp bản đồ đường phố đầu tiên (CartoDB Voyager) kèm cơ chế fallback
      currentStreetIndex = 0;
      triedStreetProviders = new Set([0]);
      currentTileLayer = createTileLayer(HUEGO_MAP_CONFIG.streetProviders[0]);
      attachTileErrorFallback(currentTileLayer, 0);
      currentTileLayer.addTo(map);

      markersClusterGroup = L.markerClusterGroup({
        chunkedLoading: true,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        maxClusterRadius: 50
      }).addTo(map);

      if (typeof HuegoMapLocationUI !== 'undefined') {
        window.huegoLocationUI = new HuegoMapLocationUI(map, {
          getNearbyPlaces: (lat, lng, count) => {
            return allMapPoints.map(p => ({
              ...p,
              distance: window.HuegoLocationService.constructor.calculateDistanceMeters(lat, lng, p.lat, p.lng)
            })).sort((a, b) => a.distance - b.distance).slice(0, count);
          }
        });
      }
    }

    // Tải 30 Di sản và 6 Cụm Di tích
    async function loadHeritageSites() {
      try {
        let res = await fetch('./data/heritage_30_sites.json').catch(() => null);
        if (!res || !res.ok) res = await fetch('/api/heritage-sites');
        allHeritageZones = await res.json();
        renderZonesList();
      } catch (e) {
        console.error('Error loading heritage sites:', e);
      }
    }

    // Tải toàn bộ 4.352 điểm toạ độ và marker cluster
    async function loadAllMapPoints() {
      try {
        let res = await fetch('./data/places_all.json').catch(() => null);
        if (!res || !res.ok) res = await fetch('/api/map-points');
        const raw = await res.json();
        if (raw.length > 0 && raw[0].address !== undefined) {
          allMapPoints = raw.filter(p => p.lat && p.lng).map(p => ({
            id: p.id,
            name: p.name_vi || p.name,
            lat: p.lat,
            lng: p.lng,
            v: p.vertical,
            cat: Array.isArray(p.subcategory) ? p.subcategory[0] : (p.category || p.vertical),
            r: p.googleRating,
            img: p.coverPhotoUrl
          }));
        } else {
          allMapPoints = raw;
        }
        renderMapMarkers();
      } catch (e) {
        console.error('Error loading map points:', e);
      }
    }

    // Màu sắc pin theo danh mục
    function getPinColor(vertical) {
      switch(vertical) {
        case 'tour': return '#c2410c';
        case 'fnb': return '#ea580c';
        case 'cafe': return '#78350f';
        case 'stay': return '#2563eb';
        case 'specialty': return '#0d9488';
        case 'nature': return '#16a34a';
        case 'service': return '#475569';
        default: return '#d97706';
      }
    }

    // Hiển thị marker clusters
    function renderMapMarkers() {
      markersClusterGroup.clearLayers();

      const markers = [];
      allMapPoints.forEach(p => {
        if (!activeVerticals.has(p.v) && p.v !== 'tour') return;

        const color = getPinColor(p.v);
        // Custom circle marker
        const icon = L.divIcon({
          className: 'custom-circle-pin',
          html: `<div style="width: 14px; height: 14px; border-radius: 50%; background: ${color}; border: 2px solid #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        const marker = L.marker([p.lat, p.lng], { icon });
        marker.on('click', () => {
          openPlaceDrawer({
            id: p.id,
            name: p.name,
            cat: p.cat || 'Heritage & Sightseeing',
            img: p.img,
            lat: p.lat,
            lng: p.lng,
            rating: p.r
          });
        });

        markers.push(marker);
      });

      markersClusterGroup.addLayers(markers);
    }

    // Render danh sách 6 zones bên trái
    function renderZonesList() {
      const container = document.getElementById('zones-list');
      if (!container) return;

      let totalPlacesShown = 0;

      container.innerHTML = allHeritageZones.map((z, idx) => {
        const filteredPlaces = currentFilterCat === 'All' 
          ? z.places 
          : z.places.filter(p => p.cat === currentFilterCat);

        totalPlacesShown += filteredPlaces.length;
        if (filteredPlaces.length === 0) return '';

        return `
          <div class="zone-group ${idx === 0 ? 'expanded' : ''}" id="zone-group-${z.id}">
            <button class="zone-header-btn" onclick="toggleZoneAccordion('${z.id}', [${z.center}], ${z.zoom})">
              <div class="zone-left">
                <span class="zone-dot" style="background: ${z.color}"></span>
                <span>${z.name}</span>
              </div>
              <span class="zone-count">${filteredPlaces.length} places</span>
            </button>
            <div class="zone-places-container">
              ${filteredPlaces.map(p => `
                <div class="place-item-row" onclick="selectHeritagePlace('${p.id}', [${p.lat}, ${p.lng}])">
                  <span>${p.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('heritage-count-label').textContent = 
        `30 Hue heritage sites · ${totalPlacesShown} shown`;
    }

    // Chuyển đổi accordion zone
    window.toggleZoneAccordion = function(zoneId, center, zoom) {
      const group = document.getElementById(`zone-group-${zoneId}`);
      if (group) {
        group.classList.toggle('expanded');
      }
      if (center && center.length === 2) {
        map.flyTo(center, zoom || 15, { duration: 1.2 });
      }
    };

    // Chọn địa điểm di sản từ danh sách
    window.selectHeritagePlace = function(placeId, coords) {
      let placeObj = null;
      for (const z of allHeritageZones) {
        const found = z.places.find(p => p.id === placeId);
        if (found) { placeObj = found; break; }
      }

      if (placeObj) {
        map.flyTo(coords, 17, { duration: 1.5 });
        openPlaceDrawer(placeObj);
      }
    };

    // Mở drawer bên phải
    function openPlaceDrawer(place) {
      selectedPlaceData = place;
      const drawer = document.getElementById('right-drawer');
      const hint = document.getElementById('right-hint');

      if (hint) hint.style.display = 'none';
      drawer.style.display = 'flex';

      const img = document.getElementById('drawer-img');
      img.src = window.resolvePlaceImage ? window.resolvePlaceImage(place) : (place.img || '');
      img.alt = '';
      img.onerror = function() { handleThumbnailError(this, place.cat || 'tour', place.name); };

      document.getElementById('drawer-badge').textContent = place.cat || 'Heritage & Sightseeing';
      document.getElementById('drawer-title').textContent = place.name;
      document.getElementById('drawer-rating').textContent = `★ ${place.rating || 4.7} · Google Maps`;
      const dirUrl = window.HuegoLocationService ? window.HuegoLocationService.constructor.getDirectionsUrl(place.lat, place.lng, place.name) : `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;
      const dirLink = document.getElementById('drawer-details-link');
      if (dirLink) {
        dirLink.href = dirUrl;
        dirLink.innerText = '🧭 Chỉ đường (Apple / Google Maps) →';
      }
      if (window.huegoLocationUI) {
        window.huegoLocationUI.showPlaceGeofence(place.lat, place.lng, place.name);
      }
      if (window.HuegoLocationService && window.HuegoLocationService.lastPosition) {
        const pos = window.HuegoLocationService.lastPosition;
        const d = window.HuegoLocationService.constructor.calculateDistanceMeters(pos.lat, pos.lng, place.lat, place.lng);
        const dText = window.HuegoLocationService.constructor.formatDistance(d);
        let distPill = document.getElementById('drawer-distance');
        if (!distPill) {
          distPill = document.createElement('span');
          distPill.className = 'meta-pill';
          distPill.id = 'drawer-distance';
          distPill.style.fontWeight = '800';
          distPill.style.color = '#2563EB';
          document.querySelector('.drawer-meta-pills')?.prepend(distPill);
        }
        distPill.innerText = `📍 Cách bạn: ${dText}`;
      }
    }

    window.closeDrawer = function() {
      document.getElementById('right-drawer').style.display = 'none';
      document.getElementById('right-hint').style.display = 'block';
      if (window.huegoLocationUI) window.huegoLocationUI.clearPlaceGeofence();
    };

    window.saveToItinerary = function() {
      if (selectedPlaceData) {
        alert(`Đã lưu "${selectedPlaceData.name}" vào hành trình Huế của bạn!`);
      }
    };

    // Lọc theo Pills bên trái
    function initFilterPills() {
      const pills = document.querySelectorAll('.pill-btn');
      pills.forEach(btn => {
        btn.addEventListener('click', () => {
          pills.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilterCat = btn.getAttribute('data-cat');
          renderZonesList();
        });
      });
    }

    // Toggle các danh mục trên thanh ngang
    window.toggleVertical = function(v, btn) {
      if (activeVerticals.has(v)) {
        activeVerticals.delete(v);
        btn.classList.add('disabled');
      } else {
        activeVerticals.add(v);
        btn.classList.remove('disabled');
      }
      renderMapMarkers();
    };

    window.togglePartners = function(btn) {
      alert("Hiển thị các đối tác du lịch & nhà cung cấp uy tín tại Huế.");
    };

    // Tải bản đồ offline
    window.downloadOfflineMap = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allMapPoints));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "hue_offline_map_data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      alert("Đang tải dữ liệu bản đồ số Huế offline (~5MB) về máy của bạn!");
    };
  </script>
</body>
</html>
