<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#2D114D" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="400" cy="200" r="300" fill="url(#glowGrad)" />

  <!-- Decorative Imperial Pattern Borders -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#D97706" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="10 6" />
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#D97706" stroke-width="1" stroke-opacity="0.2" />

  <!-- Traditional Lotus / Cloud Embellishments -->
  <path d="M 60 60 Q 90 40 120 60 Q 90 80 60 60" fill="#D97706" fill-opacity="0.3"/>
  <path d="M 740 60 Q 710 40 680 60 Q 710 80 740 60" fill="#D97706" fill-opacity="0.3"/>
  <path d="M 60 440 Q 90 420 120 440 Q 90 460 60 440" fill="#D97706" fill-opacity="0.3"/>
  <path d="M 740 440 Q 710 420 680 440 Q 710 460 740 440" fill="#D97706" fill-opacity="0.3"/>

  <!-- Center Icon Emblem -->
  <g transform="translate(400, 190)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="54" fill="#2E1065" stroke="#D97706" stroke-width="3" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#D97706" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 3" />
    <text x="0" y="16" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" text-anchor="middle" fill="#FFFFFF">☕</text>
  </g>

  <!-- Title & Subtitle with High Contrast -->
  <text x="400" y="305" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#FFFFFF" filter="url(#shadow)">Cà phê Bên Bờ Sông Hương</text>
  <text x="400" y="340" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#D97706" letter-spacing="1.5">HUEGO • HÀNH TRÌNH ĐẶC QUYỀN</text>
  <text x="400" y="375" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E2E8F0" fill-opacity="0.9">Hương cà phê muối trứ danh trong không gian trầm mặc hoài niệm</text>

  <!-- Brand watermark -->
  <g transform="translate(400, 435)" opacity="0.6">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#D97706" letter-spacing="3">CỐ ĐÔ HUẾ DI SẢN SỐ</text>
  </g>
</svg>